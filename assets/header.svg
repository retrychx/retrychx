<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">
  <!-- terminal window card -->
  <rect x="0" y="0" width="760" height="232" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- subtle top highlight -->
  <rect x="1" y="1" width="758" height="1" rx="0" fill="#21262d"/>

  <!-- traffic lights -->
  <circle cx="28" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="27" r="6" fill="#27c93f"/>

  <!-- window title -->
  <text x="92" y="33" fill="#8b949e" font-size="13">retrychx@github — zsh</text>

  <!-- $ whoami -->
  <text x="32" y="74" fill="#8b949e" font-size="14">$ whoami</text>
  <text x="32" y="104" fill="#7dcfff" font-size="24" font-weight="700">retrychx</text>

  <!-- $ cat intro.txt -->
  <text x="32" y="140" fill="#8b949e" font-size="14">$ cat intro.txt</text>
  <text x="32" y="168" fill="#9ece6a" font-size="14">Full-stack developer · AI Agent builder · pixel enthusiast</text>
  <text x="32" y="192" fill="#9ece6a" font-size="14">Crafting elegant products out of code, coffee &amp; curiosity.</text>

  <!-- # now -->
  <text x="32" y="218" fill="#565f89" font-size="13.5"># now → building TREK, a self-hosted travel planner</text>
</svg>
